name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: Watering logic (${{ matrix.compiler }}, sanitizers)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DPLANTER_SANITIZE=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  firmware:
    name: Firmware (ESP-IDF ${{ matrix.idf }}, ${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        idf: [v5.5.6, v6.0.3]
        target: [esp32, esp32s3, esp32c3]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: firmware
      - name: Size
        run: ls -l firmware/build/smart_planter.bin
